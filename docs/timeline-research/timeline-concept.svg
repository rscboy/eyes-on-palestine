<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
<title id="title">Threads of Witness — desktop and mobile concept wireframes</title>
<desc id="desc">A dark desktop archive interface uses a compact date overview, seven labeled thematic filters, a readable chronology and a source detail aside. The focused source trail links initial reporting, a later investigation and an anniversary revisit. A mobile detail flow uses a stacked list and a separate reading page. All content is illustrative draft design.</desc>
<style>text{font-family:Arial,sans-serif;fill:#ece7df}.muted{fill:#b8b2a8}.gold{fill:#c9a84c}.small{font-size:14px}.label{font-size:16px}.body{font-size:18px}.title{font-size:36px;font-family:Georgia,serif}.rule{stroke:#444039;stroke-width:1}.panel{fill:#111111;stroke:#444039}.chip{fill:#171714;stroke:#736a54}.date{font-size:14px;fill:#c9a84c}.paper{fill:#f4f1e9}.ink{fill:#24251f}.note{font-size:15px;fill:#626457}</style>
